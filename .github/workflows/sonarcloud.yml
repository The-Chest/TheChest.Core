name: SonarCloud analysis

on:
  push:
    branches: 
      - 'master'
  pull_request:
    types: [opened, synchronize, reopened]
    branches: 
      - 'master'
    paths:
      - 'src/*' 
      - 'src/**'
      - 'test/*' 
      - 'tests/**'

permissions:
  pull-requests: read

env:
  PROJECT_NAME: "TheChest.Core"

jobs:
  Tests:
    name: Tests (${{ matrix.target-framework }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dotnet-version: '2.1.x'
            target-framework: netcoreapp2.1
          - dotnet-version: '3.1.x'
            target-framework: netcoreapp3.1
          - dotnet-version: '5.0.x'
            target-framework: net5.0
          - dotnet-version: '6.0.x'
            target-framework: net6.0
          - dotnet-version: '7.0.x'
            target-framework: net7.0
          - dotnet-version: '8.0.x'
            target-framework: net8.0
          - dotnet-version: '9.0.x'
            target-framework: net9.0
          - dotnet-version: '10.0.x'
            target-framework: net10.0

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Dotnet Build
        id: dotnet-build
        uses: The-Chest/Actions/dotnet-build@v1
        with:
          project-path: "src"
          create-build-artifact: false

      - name: Restore dependencies
        run: dotnet restore
        shell: bash

      - name: Run unit Tests
        continue-on-error: false
        run: >-
          dotnet test tests/TheChest.Core.Tests.csproj
          --configuration Release
          --framework ${{ matrix.target-framework }}
          --no-restore
          -p:TargetFrameworks=${{ matrix.target-framework }}

  Analysis:
    name: SonarCloud coverage (${{ matrix.target-framework }})
    runs-on: ubuntu-latest
    needs: Tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - dotnet-version: '6.0.x'
            target-framework: net6.0

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Dotnet Build
        id: dotnet-build
        uses: The-Chest/Actions/dotnet-build@v1
        with:
          project-path: "src"
          create-build-artifact: false
      
      - name: Restore dependencies
        run: dotnet restore 
        shell: bash
        
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: 'zulu' 

      - name: Cache SonarCloud packages
        uses: actions/cache@v5
        with:
          path: ~\sonar\cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
        
      - name: Cache SonarCloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@v5
        with:
          path: .\.sonar\scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner    

      - name: Update SonarQube Cloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: bash
        run: dotnet tool update dotnet-sonarscanner --tool-path .\.sonar\scanner

      - name: Dotnet restore tools
        run: dotnet tool restore 
        
      - name: Begin Coverage Report
        run: 
          dotnet tool run dotnet-sonarscanner begin 
          /k:"The-Chest_TheChest.Core" 
          /o:"the-chest" 
          /d:sonar.token="${{ secrets.SONAR_TOKEN }}" 
          /d:sonar.host.url="https://sonarcloud.io" 
          /d:sonar.cs.opencover.reportsPaths="**/TestResults/**/coverage.opencover.xml"
          /d:sonar.scanner.scanAll=false
      
      - name: Run Tests with coverage
        continue-on-error: true
        run: dotnet test tests/TheChest.Core.Tests.csproj
          --no-restore
          --collect:"XPlat Code Coverage;Format=opencover" 
          --results-directory './TestResults/'
          --framework ${{ matrix.target-framework }}
          -p:TargetFrameworks=${{ matrix.target-framework }}
        shell: bash

      - name: Send Coverage Report
        run: 
          dotnet tool run dotnet-sonarscanner end 
          /d:sonar.token="${{ secrets.SONAR_TOKEN }}"