name: Publish Source Files Manually  
run-name: "Publishing Source Files v${{ inputs.version }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version/tag to export'
        required: true
        type: string
  push:
    branches:
      - source-files-artifacts

permissions:
  contents: write

env:
  PROJECT_NAME: "TheChest.Core"
  SOURCE_DIR: "src"
  RELEASE_OUTPUT_DIR: "src/bin/Release/netstandard2.1"

jobs:
  publish-src-files:
    name: "Publish Source Files"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: v${{ inputs.version }}

      - name: Zip Folder
        run: zip -r "${{ env.PROJECT_NAME }}.${{ inputs.version }}.zip" src/ -i "*.cs"
        
      - name: Upload Source Files to release
        uses: The-Chest/Actions/upload-release-artifacts@v1
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          path: "./"
          name: "${{ env.PROJECT_NAME }}.${{ inputs.version }}.zip"
          version: "${{ inputs.version }}"